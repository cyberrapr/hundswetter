name: morning
on:
  # No schedule: GitHub started scheduled runs about 7 hours late. The timer lives in wrangler.toml.
  workflow_dispatch:
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node morning.mjs
        env:
          LAT: ${{ secrets.LAT }}
          LON: ${{ secrets.LON }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PAGE_URL: ${{ vars.PAGE_URL }}
